[project]
name = "claude-blender-mcp"
version = "1.0.0"
description = "MCP server that lets Claude build 3D models in your own Blender"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=1.2.0"]

[project.scripts]
claude-blender-mcp = "claude_blender_mcp.server:main"

[project.optional-dependencies]
test = ["pytest"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claude_blender_mcp"]

[tool.pytest.ini_options]
testpaths = ["tests"]
